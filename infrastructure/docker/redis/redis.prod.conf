# Production Redis. It carries the permission cache, the Celery queue and its results, so it must
# never answer an unauthenticated client. The password is passed on the command line from
# REDIS_PASSWORD (compose.prod.yml); the container refuses to start without one.
#
# Reachable only on the internal `backend` network: no port is published.

bind 0.0.0.0

# TLS only (TPN review TM-009): the plain port is closed. Certificates come from the tls-init job
# (infrastructure/docker/tls/init.sh); clients are authenticated by the password, not a certificate.
port 0
tls-port 6379
tls-cert-file /tls/redis.pem
tls-key-file /tls/redis.key
tls-ca-cert-file /tls/ca.pem
tls-auth-clients no
tls-protocols "TLSv1.2 TLSv1.3"

protected-mode yes

appendonly yes

appendfsync everysec

save 60 1000

maxmemory-policy allkeys-lru
