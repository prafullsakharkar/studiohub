# Browser security headers, included at server level and again in every location that sets its own
# add_header (nginx drops inherited headers from a location that has one).
#
# This proxy is authoritative: upstream copies of these headers are hidden (proxy_hide_header in
# default.conf) so none is sent twice. Content-Security-Policy is set separately because uploads need
# a different one.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

add_header X-Content-Type-Options "nosniff" always;

add_header X-Frame-Options "DENY" always;

add_header Referrer-Policy "strict-origin" always;

add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

add_header Cross-Origin-Opener-Policy "same-origin" always;
