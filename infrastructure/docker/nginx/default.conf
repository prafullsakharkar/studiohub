upstream django {

    server django:8000;

    keepalive 32;

}

server {

    listen 80;

    server_name _;

    ##
    ## Force HTTPS
    ##

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl;

    http2 on;

    server_name _;

    ##
    ## TLS
    ##
    ## Replace the self-signed certificates in infrastructure/docker/nginx/certs
    ## with your real certificates (fullchain.pem + privkey.pem).

    ssl_certificate     /etc/nginx/certs/fullchain.pem;

    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 10m;

    charset utf-8;

    include /etc/nginx/security-headers.conf;

    # The API returns JSON and downloads: no document it sends may load or run anything.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    # This proxy sets the security headers; do not repeat the application's copies.
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Content-Security-Policy;

    ##
    ## Request limits
    ##
    ## Bodies are small by default (JSON, avatars). Only the attachment upload route may carry a
    ## large file, up to the application's ATTACHMENT_MAX_BYTES (512 MB) plus form overhead.
    ## Slow or stalled clients are cut off instead of holding a worker for an hour.
    ##

    client_max_body_size 10m;

    client_header_timeout 15s;

    client_body_timeout 60s;

    send_timeout 60s;

    proxy_connect_timeout 5s;

    proxy_send_timeout 120s;

    proxy_read_timeout 120s;

    ##
    ## Client address
    ##
    ## This proxy is the edge: X-Forwarded-For is set to the address that connected, never appended
    ## to what the client sent, so a client cannot choose the address the application records.
    ## Behind another load balancer, take the real address from it with `set_real_ip_from <lb>;`
    ## and `real_ip_header X-Forwarded-For;` first, then this header carries it on.
    ##

    ##
    ## Static files
    ##

    location /static/ {

        alias /static/;

        expires 30d;

        access_log off;

    }

    ##
    ## Media
    ##
    ## Uploaded attachments are NOT served by path. They leave only through the application's
    ## signed, short-lived download link, which hands the file to the internal location below
    ## (X-Accel-Redirect; set MEDIA_ACCEL_PREFIX=/_protected_media). Only the low-sensitivity
    ## avatar and branding images stay directly readable.
    ##

    location ^~ /media/avatars/ {

        alias /media/avatars/;

        expires 30d;

        include /etc/nginx/security-headers.conf;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    }

    location ^~ /media/branding/ {

        alias /media/branding/;

        expires 30d;

        include /etc/nginx/security-headers.conf;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    }

    location /media/ {

        return 404;

    }

    location /_protected_media/ {

        internal;

        alias /media/;

        include /etc/nginx/security-headers.conf;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        add_header Cache-Control "private, no-store" always;

    }

    ##
    ## Operator surfaces
    ##
    ## The Django admin login bypasses the API's MFA and lockout, and the schema maps every
    ## endpoint. Neither is reachable through the public proxy. To use the admin, reach the
    ## application over a private network or an authenticated tunnel and set ADMIN_ENABLED=true.
    ##

    location ^~ /admin/ {

        return 404;

    }

    location ^~ /api/schema {

        return 404;

    }

    ##
    ## Health Check
    ##

    location /health/ {

        access_log off;

        proxy_pass http://django;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

    ##
    ## Attachment uploads (the only large request bodies)
    ##

    location ~ ^/api/v1/(core/)?attachments/?$ {

        client_max_body_size 520m;

        client_body_timeout 300s;

        proxy_send_timeout 600s;

        proxy_read_timeout 600s;

        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://django;

        proxy_redirect off;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

    }

    ##
    ## Django
    ##

    location / {

        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://django;

        proxy_redirect off;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

}
