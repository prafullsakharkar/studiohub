upstream django {

    server django:8000;

    keepalive 32;

}

server {

    listen 80;

    server_name _;

    ##
    ## Force HTTPS
    ##

    return 301 https://$host$request_uri;

}

server {

    listen 443 ssl;

    http2 on;

    server_name _;

    ##
    ## TLS
    ##
    ## Replace the self-signed certificates in infrastructure/docker/nginx/certs
    ## with your real certificates (fullchain.pem + privkey.pem).

    ssl_certificate     /etc/nginx/certs/fullchain.pem;

    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_session_cache shared:SSL:10m;

    ssl_session_timeout 10m;

    charset utf-8;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20G;

    proxy_read_timeout 3600;

    proxy_send_timeout 3600;

    proxy_connect_timeout 3600;

    ##
    ## Static files
    ##

    location /static/ {

        alias /static/;

        expires 30d;

        access_log off;

    }

    ##
    ## Media
    ##
    ## Uploaded attachments are NOT served by path. They leave only through the application's
    ## signed, short-lived download link, which hands the file to the internal location below
    ## (X-Accel-Redirect; set MEDIA_ACCEL_PREFIX=/_protected_media). Only the low-sensitivity
    ## avatar and branding images stay directly readable.
    ##

    location ^~ /media/avatars/ {

        alias /media/avatars/;

        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    }

    location ^~ /media/branding/ {

        alias /media/branding/;

        expires 30d;

        add_header X-Content-Type-Options "nosniff" always;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

    }

    location /media/ {

        return 404;

    }

    location /_protected_media/ {

        internal;

        alias /media/;

        add_header X-Content-Type-Options "nosniff" always;

        add_header Content-Security-Policy "default-src 'none'; sandbox" always;

        add_header Cache-Control "private, no-store" always;

    }

    ##
    ## Operator surfaces
    ##
    ## The Django admin login bypasses the API's MFA and lockout, and the schema maps every
    ## endpoint. Neither is reachable through the public proxy. To use the admin, reach the
    ## application over a private network or an authenticated tunnel and set ADMIN_ENABLED=true.
    ##

    location ^~ /admin/ {

        return 404;

    }

    location ^~ /api/schema {

        return 404;

    }

    ##
    ## Health Check
    ##

    location /health/ {

        access_log off;

        proxy_pass http://django;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

    ##
    ## Django
    ##

    location / {

        limit_req zone=api_limit burst=60 nodelay;

        proxy_pass http://django;

        proxy_redirect off;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

    }

}
