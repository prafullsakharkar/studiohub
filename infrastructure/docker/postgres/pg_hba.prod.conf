# Production client authentication (TPN review TM-009): over the network only TLS connections with
# a password are accepted; a plain TCP connection is rejected. The socket stays trusted for the
# container's own tools (health check, initialisation).
#
# TYPE     DATABASE  USER  ADDRESS  METHOD
local      all       all            trust
hostssl    all       all   all      scram-sha-256
host       all       all   all      reject
