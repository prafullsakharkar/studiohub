name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# The token can read the repository and nothing else; a job that needs more asks for it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: studiohub
          POSTGRES_PASSWORD: studiohub
          POSTGRES_DB: studiohub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studiohub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_ENV: testing
      DJANGO_SETTINGS_MODULE: config.settings.testing
      DJANGO_SECRET_KEY: ci-only-insecure-secret-key
      DB_NAME: studiohub_ci
      DB_USER: studiohub
      DB_PASSWORD: studiohub
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Django system check
        run: uv run python manage.py check

      - name: Migration check
        run: uv run python manage.py makemigrations --check

      - name: Run tests
        # Coverage (gate fail_under=72) is off in the default `pytest` (pyproject.toml addopts).
        run: uv run pytest -q --cov=apps

  # NOTE (Phase 7): the frontend lives in the sibling studiohub-react repo,
  # so there is intentionally no frontend job here (a working-directory of
  # `frontend/` does not exist in this repo and can never pass). Frontend
  # contract protection runs in studiohub-react/.github/workflows/ci.yml
  # (tsc + vitest incl. contract conformance + build).

  # Scans the commits of the push / pull request for committed secrets (rules and test-only
  # allowances in .gitleaks.toml). Findings in older history are reviewed with
  # `gitleaks detect` and answered by rotating the credential, not by this job.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest

    # gitleaks lists the commits of a pull request to scan them.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Docs (link check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"

      - name: Check documentation links
        run: uv run python scripts/check_docs_links.py
