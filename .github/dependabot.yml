# Weekly update PRs for the four things that carry known-vulnerability risk: Python packages (the
# lock file), the frontend's npm packages (pnpm-lock.yaml), the GitHub Actions the workflows use, and the
# base images in the Dockerfiles.
# Security updates are raised as soon as an advisory is published, regardless of this schedule.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    # Hold Django on 6.0.x: django-celery-beat 2.9.0 (the latest release) requires Django<6.1, so no lock file with
    # Django 6.1 can be resolved and the whole run reported "dependency_file_not_resolvable". Patch releases of 6.0
    # (and security updates, which this does not affect) still arrive. Remove this when django-celery-beat supports 6.1.
    ignore:
      - dependency-name: "django"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The frontend (React, Vite, vitest, Biome ...): one grouped pull request a week for minor and patch updates, so the
  # CI `frontend` job (typecheck, Biome, tests, build) judges each batch; a major update is its own pull request.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/infrastructure/compose"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/django"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/nginx"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/postgres"
    schedule:
      interval: "weekly"
