# Weekly update PRs for the four things that carry known-vulnerability risk: Python packages (the
# lock file), the frontend's npm packages (pnpm-lock.yaml), the GitHub Actions the workflows use, and the
# base images in the Dockerfiles.
# Security updates are raised as soon as an advisory is published, regardless of this schedule.

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # The frontend (React, Vite, vitest, Biome ...): one grouped pull request a week for minor and patch updates, so the
  # CI `frontend` job (typecheck, Biome, tests, build) judges each batch; a major update is its own pull request.
  # Known limit (found 2026-11-11): Dependabot writes pnpm-lock.yaml without the `overrides:` block that mirrors
  # `pnpm.overrides` in package.json (the minimatch pin), so its frontend pull requests fail the CI install with
  # ERR_PNPM_LOCKFILE_CONFIG_MISMATCH, and merging one would drop the pin. Read such a pull request as a list of what is
  # new: apply the same versions with `pnpm update <package>@<version>` (it keeps the override), run the frontend gates,
  # and Dependabot closes its pull request once `develop` has the version.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      frontend-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Express 5 rejects the bare `*` route in frontend/server.ts at startup, and no test starts the server. Move to it
      # on purpose (the route, then the dev and production start-up), not by merging a bump.
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      # CI and the Docker image run Node 24; types for a newer Node describe APIs the runtime does not have.
      - dependency-name: "@types/node"
        versions: [">=25"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/infrastructure/compose"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/django"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/nginx"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/infrastructure/docker/postgres"
    schedule:
      interval: "weekly"
