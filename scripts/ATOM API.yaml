components:
  schemas:
    ActionTypeEnum:
      enum:
      - Create
      - Read
      - Update
      - Delete
      - Login
      - Logout
      - Login Failed
      type: string
      description: |-
        * `Create` - Create
        * `Read` - Read
        * `Update` - Update
        * `Delete` - Delete
        * `Login` - Login
        * `Logout` - Logout
        * `Login Failed` - Login Failed
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    ActivityLog:
      type: object
      properties:
        actor:
          type: integer
          nullable: true
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        action_time:
          type: string
          format: date-time
          readOnly: true
        remarks:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - action_time
      - action_type
    ArtistDailyLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date-time
          nullable: true
        stop_date:
          type: string
          format: date-time
          nullable: true
        ip_address:
          type: string
          nullable: true
          maxLength: 100
        duration:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        project:
          type: string
          nullable: true
        user:
          type: integer
          nullable: true
        step:
          type: string
          nullable: true
        task:
          type: string
          nullable: true
      required:
      - id
    ArtistProductivity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        duration:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        bid:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        variance:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        user:
          type: integer
          nullable: true
        step:
          type: string
          nullable: true
        project:
          type: string
          nullable: true
        created_by:
          type: integer
          nullable: true
        updated_by:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - updated_at
    Asset:
      type: object
      properties:
        uid:
          type: string
          readOnly: true
        thumbnail:
          type: string
          format: uri
          readOnly: true
        name:
          type: string
          pattern: ^[a-zA-Z0-9_.\-&'() ]*$
          maxLength: 200
        created_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        asset_type:
          $ref: '#/components/schemas/AssetTypeEnum'
        entity_type:
          type: string
          maxLength: 20
        prefix:
          type: string
          maxLength: 250
        client_name:
          type: string
          maxLength: 250
        description:
          type: string
          maxLength: 100
        tags:
          type: array
          items:
            type: string
            maxLength: 255
        created_by:
          type: integer
          nullable: true
        updated_by:
          type: integer
          nullable: true
        project:
          type: string
      required:
      - created_at
      - name
      - thumbnail
      - uid
      - updated_at
    AssetTypeEnum:
      enum:
      - Fx
      - Set
      - Vehicle
      - Prop
      - Character
      - NA
      type: string
      description: |-
        * `Fx` - Fx
        * `Set` - Set
        * `Vehicle` - Vehicle
        * `Prop` - Prop
        * `Character` - Character
        * `NA` - NA
    BlankEnum:
      enum:
      - ''
    CaseTypeEnum:
      enum:
      - Issue
      - Request
      type: string
      description: |-
        * `Issue` - Issue
        * `Request` - Request
    ChatList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        unread_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        muted:
          type: boolean
        last_message:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        contacts:
          type: array
          items:
            type: integer
      required:
      - id
    ClientConfig:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 50
        server:
          type: string
          nullable: true
          maxLength: 255
        shotgrid_project_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        user_name:
          type: string
          nullable: true
          maxLength: 255
        password:
          type: string
